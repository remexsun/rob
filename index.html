<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rex</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;
  --surface:#1a1d27;
  --border:#2a2d3e;
  --text:#e2e4f0;
  --text2:#8b8fa8;
  --accent:#6c63ff;
  --danger:#e05252;
  --radius:10px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px}

/* 顶栏（移动端） */
.topbar{display:none;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.topbar .title{font-weight:700;font-size:17px}
.menu-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 6px}

/* 布局 */
.layout{display:flex;height:100vh;position:relative}

/* 侧边栏 */
.sidebar{position:relative;width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease,min-width .25s ease}
.sidebar.collapsed{width:48px;min-width:48px}
.sidebar-head{padding:20px 16px 10px;font-size:13px;color:var(--text2);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;transition:opacity .2s}
.sidebar.collapsed .sidebar-head{opacity:0}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 8px 12px}
.sidebar.collapsed .nav{padding:4px 4px 12px}
.nav-item{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:8px;cursor:pointer;color:var(--text);transition:background .15s;user-select:none;position:relative}
.nav-item:hover{background:rgba(108,99,255,.12)}
.nav-item.active{background:rgba(108,99,255,.2);color:#a99fff}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;transition:opacity .2s}
.sidebar.collapsed .nav-item .label{opacity:0;width:0;flex:0}
.sidebar.collapsed .nav-item .del-btn{display:none!important}
.nav-item .del-btn{display:none;background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px}
.nav-item:hover .del-btn{display:block}
.sidebar-head{cursor:default}

/* 折叠按钮 */
.collapse-btn{position:absolute;top:50%;right:-14px;transform:translateY(-50%);z-index:10;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.collapse-btn:hover{color:var(--text);background:var(--accent);border-color:var(--accent)}
.sidebar.collapsed .collapse-btn{right:-14px}

/* 主内容区 */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:32px 36px}
.content h1{font-size:24px;font-weight:700;margin-bottom:8px}
.content .sub{color:var(--text2);font-size:14px;margin-bottom:28px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.card p{color:var(--text2);font-size:14px;line-height:1.7}

/* 首页：WELCOME + 倒计时 */
.home-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,3.2vh,36px);min-height:calc(100vh - 64px);padding:28px 16px}
.hero-word{margin:0;font-weight:900;letter-spacing:.06em;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:clamp(32px,6.4vw,110px);line-height:1.05}
.cd{--dh:clamp(46px,9.5vw,88px);--dhi:calc(var(--dh) - 2px);--dfs:clamp(1.55rem,6vw,3.2rem);--gap:clamp(4px,1.2vw,14px);display:flex;flex-direction:column;align-items:center;gap:10px}
.cd-title{font-size:clamp(.72rem,1.9vw,.92rem);color:var(--text2);letter-spacing:.16em;text-align:center}
.cd-timer{display:flex;align-items:center;justify-content:center;gap:var(--gap);flex-wrap:wrap;row-gap:8px}
.cd-unit{display:flex;flex-direction:column;align-items:center}
.cd-digits{display:flex;height:var(--dh);background:#0a0c10;border:1px solid var(--border);border-radius:10px;box-shadow:inset 0 0 18px #000,0 4px 12px rgba(0,0,0,.5);overflow:hidden;position:relative}
.cd-digits::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 8px 12px -8px #000,inset 0 -8px 12px -8px #000;border-radius:10px}
.cd-cell{height:var(--dhi);width:calc(var(--dfs) * .62);overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
.cd-cell + .cd-cell{border-left:1px solid #1a1d28}
.cd-scroller{display:flex;flex-direction:column;flex:0 0 auto;will-change:transform;transition:transform .4s cubic-bezier(.23,1,.32,1)}
.cd-scroller span{flex:0 0 auto;display:flex;align-items:center;justify-content:center;height:var(--dhi);width:calc(var(--dfs) * .62);font-size:var(--dfs);font-weight:700;font-variant-numeric:tabular-nums;color:#e8eaf5;text-shadow:0 0 12px rgba(140,150,255,.35)}
.cd-sep{font-size:clamp(1rem,3vw,2rem);line-height:1;color:#545a78;user-select:none;align-self:flex-start;margin-top:calc(var(--dh) / 2);transform:translateY(-50%)}
.cd-label{margin-top:6px;font-size:11px;letter-spacing:.2em;color:var(--text2)}
.cd-meta{font-size:12px;color:var(--text2);letter-spacing:.06em;text-align:center}
.cd-meta b{color:var(--text);font-weight:600}
.cd-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:7px;padding:5px 13px;font:inherit;font-size:12px;cursor:pointer;transition:color .15s,border-color .15s}
.cd-btn:hover{color:var(--text);border-color:var(--text2)}
.modal label{display:block;font-size:12px;color:var(--text2);margin:2px 0 6px;letter-spacing:.06em}
.modal input[type=datetime-local]{color-scheme:dark}

/* 管理员工具栏 */
.admin-bar{display:none;padding:12px 36px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;gap:10px;flex-wrap:wrap}
.admin-bar.show{display:flex}
.admin-bar input{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 11px;font:inherit;font-size:14px;width:180px}
.admin-bar input:focus{outline:1px solid var(--accent)}
.admin-bar select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 11px;font:inherit;font-size:14px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn.ghost:hover{border-color:var(--text2);color:var(--text)}
.btn.red{background:var(--danger)}

/* 密码弹窗 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 28px 24px;width:min(340px,90vw)}
.modal h2{font-size:17px;margin-bottom:16px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 13px;font:inherit;font-size:15px;margin-bottom:10px}
.modal input:focus{outline:1px solid var(--accent)}
.modal-err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:10px}
.modal-btns{display:flex;gap:8px}
.modal-btns .btn{flex:1;padding:10px}

/* 编辑栏目名 */
.editing .label input{background:transparent;border:none;border-bottom:1px solid var(--accent);color:var(--text);font:inherit;font-size:14px;width:100%;outline:none;padding:1px 0}

/* 移动端遮罩 */
.mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50}

@media(max-width:768px){
  .topbar{display:flex}
  .layout{height:calc(100vh - 52px)}
  .home-hero{min-height:calc(100vh - 52px - 40px);gap:18px;padding:22px 12px}
  .sidebar{position:fixed;left:-240px;top:52px;height:calc(100vh - 52px);width:240px;z-index:60;transition:left .25s ease}
  .sidebar.open{left:0}
  .sidebar.collapsed{width:240px;min-width:240px}
  .collapse-btn{display:none}
  .mob-overlay.show{display:block}
  .content{padding:20px 18px}
  .admin-bar{padding:10px 18px}
}
@media(max-width:480px){
  .content{padding:16px 14px}
  .content h1{font-size:20px}
}
</style>
</head>
<body>

<!-- 顶栏（移动端） -->
<div class="topbar">
  <span class="title" ondblclick="openAdmin()" title="双击进入管理模式">Rex</span>
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
</div>
<div class="mob-overlay" id="mobOverlay" onclick="toggleSidebar()"></div>

<div class="layout">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <button class="collapse-btn" id="collapseBtn" onclick="toggleCollapse()" title="收起/展开">‹</button>
    <div class="sidebar-head" ondblclick="openAdmin()" title="双击进入管理模式">栏目</div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <div class="admin-bar" id="adminBar">
      <input type="text" id="newName" placeholder="新栏目名称">
      <select id="newIcon">
        <option value="📌">📌 默认</option>
        <option value="📝">📝 笔记</option>
        <option value="📁">📁 文件</option>
        <option value="🔖">🔖 书签</option>
        <option value="💡">💡 想法</option>
        <option value="📊">📊 数据</option>
        <option value="🔗">🔗 链接</option>
        <option value="⭐">⭐ 收藏</option>
        <option value="🛠">🛠 工具</option>
        <option value="📷">📷 图片</option>
      </select>
      <button class="btn" onclick="addNav()">+ 添加栏目</button>
      <button class="btn ghost" onclick="exitAdmin()" style="margin-left:auto">退出管理</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- 密码弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>🔒 管理员登录</h2>
    <input type="password" id="pwdInput" placeholder="输入密码" onkeydown="if(event.key==='Enter')checkPwd()">
    <div class="modal-err" id="pwdErr"></div>
    <div class="modal-btns">
      <button class="btn ghost" onclick="closeOverlay()">取消</button>
      <button class="btn" onclick="checkPwd()">登录</button>
    </div>
  </div>
</div>

<script>
const PASS = '123123';
const STORAGE_KEY = 'rex_navs';

const DEFAULT_NAVS = [
  { id: 1, icon: '🏠', name: '首页', content: '__HOME__' },
  { id: 2, icon: '💬', name: '留言簿', content: '__GUESTBOOK__' },
  { id: 3, icon: '⭐', name: '收藏夹', content: '__BOOKMARKS__' },
  { id: 4, icon: '📁', name: '文件', content: '__FILES__' },
  { id: 5, icon: '📤', name: '上传新页面', content: '__UPLOAD__' },
];

let navs = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || DEFAULT_NAVS;
// 首页改成可渲染的倒计时页面（旧版纯 WELCOME 内容一并迁移）
navs.forEach((n,i)=>{
  if(typeof n.content==='string' && (n.content.includes('欢迎来到 Rex') || n.content.includes('点击左下角「管理员」按钮') || n.content.includes('home-hero'))){
    n.content = '__HOME__'; save();
  }
});
// 上传栏目定名「上传新页面」；其余名叫「高中」的栏目改名为「英语世界」
navs.forEach(n=>{
  if(n.content==='__UPLOAD__' && n.name!=='上传新页面'){ n.name='上传新页面'; n.icon='📤'; save(); }
});
let renamed=false;
navs.forEach(n=>{
  if(n.name==='高中'){ n.name='英语世界'; renamed=true; }
});
if(renamed) save();
// 删掉旧的「数据」栏目（id 5 且名为数据）
if(navs.some(n=>n.id===5 && n.name==='数据')){
  navs = navs.filter(n=>!(n.id===5 && n.name==='数据'));
  save();
}
// 确保特殊栏目始终存在（若 id 被别的栏目占用，就新建一个 id，绝不覆盖你的栏目）
const SPECIAL = {2:'__GUESTBOOK__', 3:'__BOOKMARKS__', 4:'__FILES__', 5:'__UPLOAD__'};
function nextId(){ return Math.max(0,...navs.map(n=>+n.id||0))+1; }
Object.entries(SPECIAL).forEach(([id,marker])=>{
  id=+id;
  if(!navs.find(n=>n.content===marker)){
    const def=DEFAULT_NAVS.find(n=>n.id===id);
    if(!def) return;
    const idx=navs.findIndex(n=>n.id===id);
    if(idx>=0 && (navs[idx].name===def.name || navs[idx].content===def.content)){ navs[idx]=def; }
    else{ navs.push(Object.assign({},def,{id:nextId()})); }
    save();
  }
});
// 保证「英语世界」栏目一定存在（老数据被覆盖或清空时自动补回）
if(!navs.find(n=>n.name==='英语世界')){
  navs.push({ id: nextId(), icon:'📚', name:'英语世界', content:'<p style="color:var(--text2)">这里放英语学习内容。管理员模式下可编辑。</p>' });
  save();
}
let current = navs[0]?.id;
let isAdmin = false;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(navs)); }

function renderNav(){
  const el = document.getElementById('nav');
  el.innerHTML = navs.map(n => `
    <div class="nav-item${n.id===current?' active':''}" onclick="select(${n.id})">
      <span class="icon">${n.icon}</span>
      <span class="label">${esc(n.name)}</span>
      ${isAdmin ? `<button class="del-btn" onclick="event.stopPropagation();delNav(${n.id})" title="删除">✕</button>` : ''}
    </div>
  `).join('');
}

function renderContent(){
  const n = navs.find(x=>x.id===current);
  if(!n){ document.getElementById('content').innerHTML = '<h1>请选择栏目</h1>'; return; }
  if(n.content === '__HOME__'){ renderHome(); }
  else if(n.content === '__GUESTBOOK__'){ renderGuestbook(); }
  else if(n.content === '__BOOKMARKS__'){ renderBookmarks(); }
  else if(n.content === '__FILES__'){ renderFiles(); }
  else if(n.content === '__UPLOAD__'){ renderUpload(); }
  else { document.getElementById('content').innerHTML = n.content; }
}

function select(id){
  current = id;
  renderNav();
  renderContent();
  if(window.innerWidth<=768) toggleSidebar(false);
}

function addNav(){
  const name = document.getElementById('newName').value.trim();
  const icon = document.getElementById('newIcon').value;
  if(!name){ document.getElementById('newName').focus(); return; }
  const id = Date.now();
  navs.push({ id, icon, name, content: `<h1>${esc(name)}</h1><p class="sub">这是「${esc(name)}」栏目的内容</p><div class="card"><h3>开始编辑</h3><p>管理员可在此添加内容。</p></div>` });
  document.getElementById('newName').value = '';
  save(); renderNav(); select(id);
}

function delNav(id){
  if(!confirm('确定删除这个栏目？')) return;
  navs = navs.filter(n=>n.id!==id);
  if(current===id) current = navs[0]?.id;
  save(); renderNav(); renderContent();
}

/* 管理员（无侧边栏按钮，双击标题或 Ctrl+Alt+A 进入） */
function openAdmin(){
  if(isAdmin) return;
  document.getElementById('overlay').classList.add('show');
  setTimeout(()=>document.getElementById('pwdInput').focus(),60);
}
function exitAdmin(){
  isAdmin = false;
  document.getElementById('adminBar').classList.remove('show');
  renderNav(); renderContent();
}
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.altKey && e.key.toLowerCase()==='a'){ e.preventDefault(); openAdmin(); }
});
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('pwdErr').textContent=''; }
function checkPwd(){
  if(document.getElementById('pwdInput').value===PASS){
    isAdmin=true; closeOverlay();
    document.getElementById('pwdInput').value='';
    document.getElementById('adminBar').classList.add('show');
    renderNav(); renderContent();
  } else {
    document.getElementById('pwdErr').textContent='密码错误';
    document.getElementById('pwdInput').select();
  }
}

/* 移动端侧边栏 */
function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const mo = document.getElementById('mobOverlay');
  const open = force!==undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  mo.classList.toggle('show', open);
}

/* 折叠侧边栏（PC端） */
let sidebarCollapsed = false;
function toggleCollapse(){
  sidebarCollapsed = !sidebarCollapsed;
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('collapseBtn');
  sb.classList.toggle('collapsed', sidebarCollapsed);
  btn.textContent = sidebarCollapsed ? '›' : '‹';
}

/* ===== 留言簿（Supabase） ===== */
const SB_URL = 'https://ywznnhdmfuwjrrppaath.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3em5uaGRtZnV3anJycHBhYXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0OTExMTgsImV4cCI6MjExMTA2NzExOH0.BcXwTk-knThkyPWpAyzCy2kiGmYRaDmz2iBJWVSsb4c';

async function gbLoad(){
  const r = await fetch(`${SB_URL}/rest/v1/guestbook?select=*&order=created_at.desc`, {
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function gbInsert(name, msg){
  const r = await fetch(`${SB_URL}/rest/v1/guestbook`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify({ name, msg })
  });
  if(!r.ok){ const t=await r.text(); throw new Error(t); }
}
async function gbRemove(id){
  const r = await fetch(`${SB_URL}/rest/v1/guestbook?id=eq.${id}`, {
    method: 'DELETE',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
  });
  if(!r.ok) throw new Error(r.status);
}

async function renderGuestbook(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <h1>💬 留言簿</h1>
    <p class="sub">留下你的话吧</p>
    <div class="card" style="margin-bottom:24px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <input id="gb-name" placeholder="你的名字（可选）" style="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font:inherit;font-size:14px;outline:none" onfocus="this.style.outline='1px solid var(--accent)'" onblur="this.style.outline='none'">
        <textarea id="gb-msg" placeholder="写下你的留言…" rows="3" style="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font:inherit;font-size:14px;resize:vertical;outline:none" onfocus="this.style.outline='1px solid var(--accent)'" onblur="this.style.outline='none'"></textarea>
        <div style="display:flex;justify-content:flex-end">
          <button class="btn" onclick="gbSubmit()" style="padding:8px 22px">发送留言</button>
        </div>
      </div>
    </div>
    <div id="gb-list"><p style="color:var(--text2);font-size:14px;text-align:center;padding:24px 0">加载中…</p></div>`;
  gbRefreshList();
}

async function gbRefreshList(){
  const el = document.getElementById('gb-list');
  if(!el) return;
  let list;
  try{ list = await gbLoad(); }
  catch(e){ el.innerHTML=`<p style="color:var(--danger);font-size:14px">加载失败：${e.message}</p>`; return; }
  if(!list.length){ el.innerHTML='<p style="color:var(--text2);font-size:14px;text-align:center;padding:24px 0">还没有留言，来第一个吧 ✨</p>'; return; }
  el.innerHTML = list.map(m => {
    const date = new Date(m.created_at).toLocaleString('zh-CN');
    return `<div class="card" style="position:relative">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">${esc(m.name||'匿').charAt(0)}</span>
        <div>
          <div style="font-size:14px;font-weight:600">${esc(m.name||'匿名')}</div>
          <div style="font-size:11px;color:var(--text2)">${date}</div>
        </div>

/* ===== 文件管理（Supabase Storage rob2） ===== */
const FILE_PASS='123123';
let fileAuthed=false;
const SB_BUCKET='rob2';

/* 文件备注：存在 Supabase 表 file_notes，表不存在时退回浏览器本地 */
let fileNotes={}, notesRemote=true, noteEditName=null, fileCache=[];
const NOTES_KEY='rex_file_notes';

async function notesLoad(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/file_notes?select=name,note`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    if(!r.ok) throw new Error(r.status);
    const rows=await r.json();
    fileNotes={}; rows.forEach(x=>{ fileNotes[x.name]=x.note||''; });
    notesRemote=true;
  }catch(e){
    notesRemote=false;
    try{ fileNotes=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}')||{}; }catch(_){ fileNotes={}; }
  }
}
async function noteSave(name,note){
  note=note||'';
  if(notesRemote){
    const r=await fetch(`${SB_URL}/rest/v1/file_notes`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({name,note,updated_at:new Date().toISOString()})});
    if(!r.ok){const t=await r.text();throw new Error(t);}
  }else{
    localStorage.setItem(NOTES_KEY,JSON.stringify(Object.assign({},fileNotes,{[name]:note})));
  }
  fileNotes[name]=note;
}
async function noteRemove(name){
  delete fileNotes[name];
  if(notesRemote){
    try{ await fetch(`${SB_URL}/rest/v1/file_notes?name=eq.${encodeURIComponent(name)}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}); }catch(e){}
  }else{
    localStorage.setItem(NOTES_KEY,JSON.stringify(fileNotes));
  }
}

async function renderFiles(){
  const c=document.getElementById('content');
  if(!fileAuthed){
    c.innerHTML=`<h1>📁 文件管理</h1><p class="sub">需要密码才能访问</p>
    <div class="card" style="max-width:360px">
      <div style="display:flex;flex-direction:column;gap:10px">
        <input type="password" id="file-pwd" placeholder="输入密码" style="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 11px;font:inherit;font-size:14px;outline:none" onfocus="this.style.outline='1px solid var(--accent)'" onblur="this.style.outline='none'" onkeydown="if(event.key==='Enter')fileLogin()">
        <div id="file-err" style="color:var(--danger);font-size:13px;min-height:16px"></div>

  <div class="card" style="margin-bottom:24px">
    <label id="file-drop" style="display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--border);border-radius:9px;padding:20px;cursor:pointer;color:var(--text2);font-size:13px;text-align:center" ondragover="event.preventDefault();this.style.borderColor='var(--accent)'" ondragleave="this.style.borderColor='var(--border)'" ondrop="fileDrop(event)">
      <span style="font-size:28px">📤</span>

      <input type="file" id="file-input" multiple style="display:none" onchange="filePickFiles(this.files)">
    </label>
    <input id="file-note" placeholder="备注（可选）：本次上传的文件都会写上" style="width:100%;margin-top:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font:inherit;font-size:13px;outline:none" onfocus="this.style.outline='1px solid var(--accent)'" onblur="this.style.outline='none'">
    <div id="file-status" style="color:var(--text2);font-size:13px;min-height:18px;margin-top:8px;text-align:center"></div>
  </div>
  <div id="file-list"><p style="color:var(--text2);font-size:14px;text-align:center;padding:24px 0">加载中…</p></div>`;
  document.getElementById('file-drop').addEventListener('click',function(e){if(e.target!==document.getElementById('file-input'))document.getElementById('file-input').click();});

function fileLogin(){
  if(document.getElementById('file-pwd')?.value===FILE_PASS){fileAuthed=true;renderFiles();}
  else{const e=document.getElementById('file-err');if(e)e.textContent='密码错误';}
}
function fileDrop(e){e.preventDefault();document.getElementById('file-drop').style.borderColor='var(--border)';filePickFiles(e.dataTransfer.files);}
async function filePickFiles(files){
  const st=document.getElementById('file-status');if(st)st.textContent='上传中…';
  const note=(document.getElementById('file-note')?.value||'').trim();
  let ok=0,fail=0;
  for(const file of Array.from(files)){
    const name=Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9.\-_]/g,'_');
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    const type=file.type || (ext==='html'||ext==='htm' ? 'text/html; charset=utf-8' : 'application/octet-stream');
    const r=await fetch(`${SB_URL}/storage/v1/object/${SB_BUCKET}/${encodeURIComponent(name)}`,{method:'POST',headers:{'Authorization':'Bearer '+SB_KEY,'Content-Type':type,'x-upsert':'true'},body:file});
    if(r.ok){ ok++; if(note){ try{ await noteSave(name,note); }catch(e){} } } else fail++;
  }
  if(st)st.textContent=ok+'个上传成功'+(fail?'，'+fail+'个失败':'');
  if(ok && note){ const el=document.getElementById('file-note'); if(el) el.value=''; }
  fileRefresh();
}

function fmtSize(n){if(!n)return'';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB';}

async function fileRefresh(){
  const el=document.getElementById('file-list');if(!el)return;
  const r=await fetch(`${SB_URL}/storage/v1/object/list/${SB_BUCKET}`,{method:'POST',headers:{'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({prefix:'',limit:200,offset:0,sortBy:{column:'created_at',order:'desc'}})});
  if(!r.ok){el.innerHTML=`<p style="color:var(--danger);font-size:14px">加载失败 ${r.status}</p>`;return;}

  await notesLoad();

}

function renderFileList(){
  const el=document.getElementById('file-list'); if(!el)return;
  const list=fileCache||[];
  if(!list.length){el.innerHTML='<p style="color:var(--text2);font-size:14px;text-align:center;padding:24px 0">暂无文件</p>';return;}
  el.innerHTML=list.map((f,i)=>{

            <input id="fn-input" value="${escAttr(note)}" placeholder="备注（可留空）" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);color:var(--text);border-radius:6px;padding:6px 9px;font:inherit;font-size:12px;outline:none">
            <button onclick="fileNoteSaveAt(${i})" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer">保存</button>
            <button onclick="fileNoteCancel()" style="background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer">取消</button>
          </div>`
        : `<div style="display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap">
            <span style="background:rgba(108,99,255,.12);color:${note?'var(--text)':'var(--text2)'};border-radius:5px;padding:2px 8px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📝 ${note?esc(note):'无备注'}</span>
            <button onclick="fileNoteEditAt(${i})" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:12px;padding:0;text-decoration:underline">${note?'修改备注':'添加备注'}</button>
          </div>`}
      </div>
      <a href="${url}" target="_blank" download="${escAttr(disp)}" style="color:var(--accent);font-size:12px;text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:5px;white-space:nowrap">下载</a>
      <button onclick="fileDeleteAt(${i})" style="background:none;border:1px solid var(--border);color:var(--danger);border-radius:5px;padding:4px 8px;cursor:pointer;font-size:12px;white-space:nowrap">删除</button>
    </div>`;
  }).join('');
  if(!notesRemote){
    el.innerHTML += `<p style="color:var(--text2);font-size:12px;text-align:center;margin-top:4px">⚠ 备注暂存在本机，换设备看不到（需先在 Supabase 建 file_notes 表）</p>`;
  }

function fileNoteEditAt(i){ const f=fileCache[i]; if(!f)return; noteEditName=f.name; renderFileList(); setTimeout(()=>document.getElementById('fn-input')?.focus(),30); }
function fileNoteCancel(){ noteEditName=null; renderFileList(); }
async function fileNoteSaveAt(i){
  const f=fileCache[i]; if(!f)return;
  const v=(document.getElementById('fn-input')?.value||'').trim();
  try{ await noteSave(f.name,v); noteEditName=null; renderFileList(); }

async function fileDeleteAt(i){
  const f=fileCache[i]; if(!f)return;
  const name=f.name;
  if(!confirm('删除「'+name.replace(/^\d+_/,'')+'」？'))return;
  await fetch(`${SB_URL}/storage/v1/object/${SB_BUCKET}/${encodeURIComponent(name)}`,{method:'DELETE',headers:{'Authorization':'Bearer '+SB_KEY}});
  await noteRemove(name);

function fileIcon2(mime){if(!mime)return'📄';if(mime.startsWith('image/'))return'🖼️';if(mime.startsWith('video/'))return'🎬';if(mime.startsWith('audio/'))return'🎵';if(mime==='application/pdf')return'📕';if(mime.includes('zip'))return'🗜️';return'📄';}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ===== 上传新页面：上传 HTML 到 GitHub Pages 站点仓库根目录 ===== */
const GH_TOKEN_KEY='rex_gh_token';
let upAuthed=false;

function siteRepo(){
  const saved=(localStorage.getItem('rex_gh_repo')||'').trim();
  if(saved) return saved;
  const host=location.hostname||'';
  if(!host || !host.endsWith('.github.io')) return 'remexsun/rob';
  const owner=host.slice(0,-10);
  let segs=location.pathname.split('/').filter(Boolean);
  if(segs.length && /\.(html?|htm)$/i.test(segs[segs.length-1])) segs.pop();
  const repo=segs.length?segs[0]:owner+'.github.io';
  return owner+'/'+repo;
}
function siteBase(repo){
  const owner=repo.split('/')[0], r=repo.split('/')[1]||'';
  return r===owner+'.github.io' ? 'https://'+owner+'.github.io/' : 'https://'+owner+'.github.io/'+r+'/';
}

function renderUpload(){
  const c=document.getElementById('content');
  const repo=siteRepo(), base=siteBase(repo);
  if(!upAuthed){
    c.innerHTML='<h1>📤 上传新页面</h1><p class="sub">上传 HTML 页面需要管理员密码</p>'
    +'<div class="card" style="max-width:360px"><div style="display:flex;flex-direction:column;gap:10px">'
    +'<input type="password" id="up-pwd" placeholder="输入密码" style="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 11px;font:inherit;font-size:14px;outline:none" onfocus="this.style.outline=\'1px solid var(--accent)\'" onblur="this.style.outline=\'none\'" onkeydown="if(event.key===\'Enter\')upLogin()">'
    +'<div id="up-pwd-err" style="color:var(--danger);font-size:13px;min-height:16px"></div>'
    +'<button class="btn" onclick="upLogin()" style="padding:9px">进入</button>'
    +'</div></div>';
    setTimeout(function(){var el=document.getElementById('up-pwd'); if(el) el.focus();},60);
    return;
  }
  const hasTok=!!(localStorage.getItem(GH_TOKEN_KEY)||'').trim();
  const inpStyle="background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 11px;font:inherit;font-size:13px;outline:none";
  c.innerHTML='<h1>📤 上传新页面</h1><p class="sub">上传 HTML 页面到 '+esc(repo)+' 根目录，上传后的网址是 '+esc(base)+'文件名.html</p>'
  +'<div class="card">'
    +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">'
      +'<span style="font-size:12px;color:'+(hasTok?'var(--text2)':'var(--danger)')+'">'+(hasTok?'✅ 已保存 GitHub token':'⚠ 还没有 token，先粘贴一个')+'</span>'
      +'<button onclick="upTokToggle()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;text-decoration:underline">'+(hasTok?'更换 token':'填 token')+'</button>'
    +'</div>'
    +'<div id="up-tok-box" style="display:'+(hasTok?'none':'block')+';margin-bottom:14px">'
      +'<input type="password" id="up-tok" placeholder="粘贴 GitHub token（ghp_… 或 github_pat_…）" style="width:100%;'+inpStyle+'">'
      +'<button class="btn" onclick="upSaveTok()" style="margin-top:8px;padding:8px;width:100%;font-size:13px">保存到本机</button>'
      +'<div style="color:var(--text2);font-size:11px;margin-top:6px;line-height:1.7">只存在这台设备的浏览器里，不会写进网页代码。该 token 需要 '+esc(repo)+' 的 Contents 写权限。</div>'
    +'</div>'
    +'<label id="up-drop" style="display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--border);border-radius:9px;padding:20px;cursor:pointer;color:var(--text2);font-size:13px;text-align:center" ondragover="event.preventDefault();this.style.borderColor=\'var(--accent)\'" ondragleave="this.style.borderColor=\'var(--border)\'" ondrop="upDrop(event)">'
      +'<span style="font-size:28px">📄</span>'
      +'<span id="up-fname">点击选择 .html 文件，或拖拽到这里</span>'
      +'<input type="file" id="up-file" accept=".html,.htm,text/html" style="display:none" onchange="upPick(this)">'
    +'</label>'
    +'<input id="up-name" placeholder="文件名（默认用原文件名，可改，不用写 .html）" style="width:100%;margin-top:12px;'+inpStyle+'">'
    +'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="upUpload()" style="flex:1;padding:9px">开始上传</button></div>'
    +'<div id="up-status" style="font-size:13px;min-height:18px;margin-top:10px;text-align:center;color:var(--text2)"></div>'
    +'<div id="up-result"></div>'
  +'</div>';
  var drop=document.getElementById('up-drop');
  if(drop) drop.addEventListener('click',function(e){ var fi=document.getElementById('up-file'); if(fi && e.target!==fi) fi.click(); });
}

function upLogin(){
  if(document.getElementById('up-pwd') && document.getElementById('up-pwd').value===PASS){ upAuthed=true; renderUpload(); }
  else{ var e=document.getElementById('up-pwd-err'); if(e) e.textContent='密码错误'; }
}
function upTokToggle(){
  var b=document.getElementById('up-tok-box'); if(!b) return;
  b.style.display = b.style.display==='none' ? 'block' : 'none';
}
function upSaveTok(){
  var v=(document.getElementById('up-tok')?document.getElementById('up-tok').value:'').trim();
  if(!v){ alert('先粘贴 token'); return; }
  localStorage.setItem(GH_TOKEN_KEY,v); renderUpload();
  var st=document.getElementById('up-status'); if(st){ st.textContent='token 已保存到这台设备'; st.style.color='var(--accent)'; }
}
function upDrop(e){ e.preventDefault(); var d=document.getElementById('up-drop'); if(d) d.style.borderColor='var(--border)'; upFiles(e.dataTransfer.files); }
function upPick(el){ upFiles(el.files); }
function upFiles(files){
  var f=files && files[0]; if(!f) return;
  var fn=document.getElementById('up-fname'); if(fn) fn.textContent=f.name+' · '+fmtSize(f.size);
  var nm=document.getElementById('up-name'); if(nm && !nm.value) nm.value=f.name.replace(/\.html?$/i,'');
}
function upB64(bytes){
  var s='', CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}

async function upUpload(){
  var st=document.getElementById('up-status'), res=document.getElementById('up-result');
  var say=function(m,col){ if(st){ st.textContent=m; st.style.color=col||'var(--text2)'; } };
  if(res) res.innerHTML='';
  var tok=(localStorage.getItem(GH_TOKEN_KEY)||'').trim();
  if(!tok){ say('先粘贴并保存 GitHub token','var(--danger)'); return; }
  var fi=document.getElementById('up-file');
  var f=fi && fi.files && fi.files[0];
  if(!f){ say('先选择一个 HTML 文件','var(--danger)'); return; }
  var name=((document.getElementById('up-name')||{}).value||'').trim() || f.name;
  name=name.replace(/\s+/g,'-').replace(/[^\p{L}\p{N}._-]/gu,'-');
  if(!/\.html?$/i.test(name)) name+='.html';
  var repo=siteRepo(), base=siteBase(repo);
  var api='https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(name);
  var H={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  say('读取文件…');
  var bytes=new Uint8Array(await f.arrayBuffer());
  if(bytes.length>25*1024*1024){ say('文件太大（GitHub 接口单文件上限 25MB）','var(--danger)'); return; }
  var content=upB64(bytes);
  var sha=null;
  try{
    var g=await fetch(api+'?t='+Date.now(),{headers:H,cache:'no-store'});
    if(g.status===200){ sha=(await g.json()).sha; }
    else if(g.status===401){ say('token 无效或已过期','var(--danger)'); return; }
    else if(g.status===403){ say('token 无权写这个仓库，或触发了接口限额','var(--danger)'); return; }
    else if(g.status!==404){ say('检查是否已有同名文件失败：HTTP '+g.status,'var(--danger)'); return; }
  }catch(e){ say('网络错误：'+e.message,'var(--danger)'); return; }
  say(sha?'发现同名文件，覆盖中…':'上传中…');
  var body={message:'upload '+name+' via rex site',content:content};
  if(sha) body.sha=sha;
  var r;
  try{ r=await fetch(api,{method:'PUT',headers:Object.assign({},H,{'Content-Type':'application/json'}),body:JSON.stringify(body)}); }
  catch(e){ say('网络错误：'+e.message,'var(--danger)'); return; }
  if(r.ok||r.status===201){
    var url=base+name;
    say('上传成功，GitHub Pages 正在重建，约 1 分钟后就能打开','var(--accent)');
    if(res) res.innerHTML='<div class="card" style="display:flex;align-items:center;gap:10px">'
      +'<div style="flex:1;min-width:0"><div style="font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(name)+'</div>'
      +'<div style="font-size:11px;color:var(--text2);word-break:break-all">'+esc(url)+'</div></div>'
      +'<a href="'+escAttr(url)+'" target="_blank" style="color:var(--accent);font-size:12px;text-decoration:none;padding:4px 10px;border:1px solid var(--border);border-radius:5px;white-space:nowrap">打开</a></div>';
    return;
  }
  var msg='HTTP '+r.status;
  try{ var j=await r.json(); if(j && j.message) msg=j.message; }catch(e){}
  if(r.status===401) msg='token 无效或已过期';
  if(r.status===403) msg='token 没有 Contents 写权限';
  if(r.status===422 && sha) msg='同名文件刚被改过，再点一次上传即可';
  say('上传失败：'+msg,'var(--danger)');
}

/* ===== 首页：WELCOME + 倒计时（管理员可改时间） ===== */
const CD_KEY='rex_countdown';
let cdCfg=null, cdScrollers={}, cdLast={}, cdTimerId=null, cdRemoteChecked=false;

function cdDefault(){ return { title:'距 2027 西安高中寒假', target:'2027-01-29T00:00' }; }
function cdLoadLocal(){
  try{
    const v=JSON.parse(localStorage.getItem(CD_KEY)||'null');
    if(v && v.target) return { title: v.title || cdDefault().title, target: v.target };
  }catch(e){}
  return cdDefault();
}
function cdPretty(s){ return String(s||'').replace('T',' ').slice(0,16); }

async function cdRemoteLoad(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/site_settings?key=eq.countdown&select=value`,{headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY},cache:'no-store'});
    if(!r.ok) return null;
    const a=await r.json();
    if(a && a[0] && a[0].value){ const v=JSON.parse(a[0].value); if(v && v.target) return v; }
  }catch(e){}
  return null;
}
async function cdRemoteSave(cfg){
  try{
    await fetch(`${SB_URL}/rest/v1/site_settings`,{method:'POST',headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify([{key:'countdown',value:JSON.stringify(cfg)}])});
  }catch(e){}
}

function renderHome(){
  const c=document.getElementById('content');
  if(!cdCfg) cdCfg=cdLoadLocal();
  c.innerHTML='<div class="home-hero">'
    +'<div class="hero-word">WELCOME</div>'
    +'<div class="cd">'
      +'<div class="cd-title" id="cdTitle">'+esc(cdCfg.title)+'</div>'
      +'<div class="cd-timer" id="cdTimer"></div>'
      +'<div class="cd-meta" id="cdMeta"></div>'
      +'<div><button class="cd-btn" onclick="cdAdminOpen()">⚙ 管理</button></div>'
    +'</div></div>';
  cdBuild();
  cdStart();
  if(!cdRemoteChecked){
    cdRemoteChecked=true;
    cdRemoteLoad().then(function(rc){
      if(rc && JSON.stringify(rc)!==JSON.stringify(cdCfg)){
        cdCfg=rc; localStorage.setItem(CD_KEY,JSON.stringify(cdCfg));
        if(document.getElementById('cdTimer')) renderHome();
      }
    });
  }
}

function cdUnits(){
  return [{key:'days',label:'天',digits:3},{key:'hours',label:'时',digits:2},{key:'minutes',label:'分',digits:2},{key:'seconds',label:'秒',digits:2}];
}

function cdBuild(){
  const box=document.getElementById('cdTimer'); if(!box) return;
  box.innerHTML=''; cdScrollers={}; cdLast={};
  cdUnits().forEach(function(u){
    const wrap=document.createElement('div'); wrap.className='cd-unit';
    const digits=document.createElement('div'); digits.className='cd-digits';
    cdScrollers[u.key]=[]; cdLast[u.key]=[];
    for(let i=0;i<u.digits;i++){
      const cell=document.createElement('div'); cell.className='cd-cell';
      const sc=document.createElement('div'); sc.className='cd-scroller';
      sc.style.transition='none';
      for(let d=0;d<=9;d++){ const sp=document.createElement('span'); sp.textContent=d; sc.appendChild(sp); }
      cell.appendChild(sc); digits.appendChild(cell);
      cdScrollers[u.key].push(sc); cdLast[u.key].push(null);
    }
    const lb=document.createElement('div'); lb.className='cd-label'; lb.textContent=u.label;
    wrap.appendChild(digits); wrap.appendChild(lb); box.appendChild(wrap);
    if(u.key!=='seconds'){ const sep=document.createElement('div'); sep.className='cd-sep'; sep.textContent=':'; box.appendChild(sep); }
  });
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    Object.keys(cdScrollers).forEach(function(k){ cdScrollers[k].forEach(function(s){ s.style.transition=''; }); });
  }); });
}

function cdSetUnit(key, value){
  const unit=cdUnits().filter(function(u){ return u.key===key; })[0]; if(!unit) return;
  const digits=unit.digits;
  const str=String(Math.min(Math.max(value,0), Math.pow(10,digits)-1)).padStart(digits,'0');
  for(let i=0;i<digits;i++){
    const digit=parseInt(str.charAt(i),10);
    if(cdLast[key][i]===digit) continue;
    cdLast[key][i]=digit;
    const sc=cdScrollers[key][i]; if(!sc) continue;
    sc.style.transform='translateY(calc(var(--dhi) * '+(-digit)+'))';
  }
}

function cdTick(){
  if(!cdCfg) cdCfg=cdLoadLocal();
  const meta=document.getElementById('cdMeta');
  const target=new Date(cdCfg.target).getTime();
  if(isNaN(target)){ if(meta) meta.textContent='目标时间无效'; return; }
  let diff=target-Date.now();
  if(diff<=0){
    cdSetUnit('days',0); cdSetUnit('hours',0); cdSetUnit('minutes',0); cdSetUnit('seconds',0);
    if(meta) meta.innerHTML='<b>目标时间已到</b>';
    return;
  }
  const days=Math.floor(diff/86400000); diff-=days*86400000;
  const hours=Math.floor(diff/3600000); diff-=hours*3600000;
  const minutes=Math.floor(diff/60000); diff-=minutes*60000;
  const seconds=Math.floor(diff/1000);
  cdSetUnit('days',days); cdSetUnit('hours',hours); cdSetUnit('minutes',minutes); cdSetUnit('seconds',seconds);
  if(meta) meta.innerHTML='目标 <b>'+esc(cdPretty(cdCfg.target))+'</b>';
}

function cdStart(){
  if(cdTimerId){ clearInterval(cdTimerId); cdTimerId=null; }
  cdTick();
  cdTimerId=setInterval(function(){ if(document.getElementById('cdTimer')) cdTick(); }, 250);
}

function cdAdminOpen(){
  const old=document.getElementById('cdModal'); if(old) old.remove();
  const el=document.createElement('div'); el.className='overlay show'; el.id='cdModal';
  el.addEventListener('click',function(e){ if(e.target===el) cdClose(); });
  el.innerHTML='<div class="modal">'
    +'<h2>管理倒计时</h2>'
    +'<div id="cdStep1">'
      +'<input type="password" id="cdPwd" placeholder="输入密码" onkeydown="if(event.key===\'Enter\')cdCheckPwd()">'
      +'<div class="modal-err" id="cdErr"></div>'
      +'<div class="modal-btns"><button class="btn ghost" onclick="cdClose()">取消</button><button class="btn" onclick="cdCheckPwd()">确定</button></div>'
    +'</div>'
    +'<div id="cdStep2" style="display:none">'
      +'<label>标题文字</label>'
      +'<input id="cdFTitle" placeholder="例如：距 2027 西安高中寒假">'
      +'<label>目标时间</label>'
      +'<input type="datetime-local" id="cdFTime">'
      +'<div class="modal-err" id="cdErr2"></div>'
      +'<div class="modal-btns"><button class="btn ghost" onclick="cdClose()">取消</button><button class="btn" onclick="cdSave()">保存</button></div>'
    +'</div></div>';
  document.body.appendChild(el);
  setTimeout(function(){ const p=document.getElementById('cdPwd'); if(p) p.focus(); },50);
}

function cdClose(){ const el=document.getElementById('cdModal'); if(el) el.remove(); }

function cdCheckPwd(){
  const v=(document.getElementById('cdPwd')||{}).value||'';
  if(v!==PASS){ const e=document.getElementById('cdErr'); if(e) e.textContent='密码错误'; return; }
  const s1=document.getElementById('cdStep1'), s2=document.getElementById('cdStep2');
  if(s1) s1.style.display='none';
  if(s2) s2.style.display='block';
  const cur=cdCfg||cdLoadLocal();
  const t=document.getElementById('cdFTitle'); if(t) t.value=cur.title;
  const d=document.getElementById('cdFTime'); if(d) d.value=String(cur.target).slice(0,16);
  setTimeout(function(){ if(d) d.focus(); },50);
}

function cdSave(){
  const title=((document.getElementById('cdFTitle')||{}).value||'').trim();
  const time=((document.getElementById('cdFTime')||{}).value||'').trim();
  const err=document.getElementById('cdErr2');
  if(!time){ if(err) err.textContent='请选择目标时间'; return; }
  if(isNaN(new Date(time).getTime())){ if(err) err.textContent='时间格式不正确'; return; }
  cdCfg={ title: title || cdDefault().title, target: time };
  localStorage.setItem(CD_KEY, JSON.stringify(cdCfg));
  cdRemoteSave(cdCfg);
  cdClose();
  renderHome();
}

renderNav(); renderContent();
</script>
